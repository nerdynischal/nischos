<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Nischal" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="nischOS is Nischal's desktop-inspired portfolio for projects, experiments, and notes."
    />
    <meta property="og:title" content="nischOS" />
    <meta
      property="og:description"
      content="Nischal's desktop-inspired portfolio for projects, experiments, and notes."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#050505" />
    <script>
      ;(() => {
        const storageKey = 'nischos-theme'
        let preference = 'system'

        try {
          const storedPreference = window.localStorage.getItem(storageKey)
          if (storedPreference === 'light' || storedPreference === 'dark') {
            preference = storedPreference
          }
        } catch {
          // Use the system preference when browser storage is unavailable.
        }

        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference
        const themeColor = theme === 'dark' ? '#050505' : '#f6f6f6'

        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', themeColor)
      })()
    </script>
    <title>nischOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
